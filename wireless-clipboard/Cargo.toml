[package]
name = "wireless-clipboard"
version = "0.1.0"
edition = "2021"
description = "A standard iced program: wireless clipboard web server and QR pairing"
license = "GPL-3.0-only"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["thread-pool", "x11", "wayland", "qr_code"] }
pomelo-widgets = { git = "https://github.com/pomelos-on-sale/pomelo-widgets.git", rev = "3e3d1cfa25e92bf6fc96e4b30e176891d46aaed6" }
pomelo-material-symbols = { git = "https://github.com/pomelos-on-sale/pomelo-material-symbols.git", rev = "7dc390fb1924dc69b375e5ae77806857f798cc58" }
pomelo-hal = { git = "https://github.com/pomelos-on-sale/pomelo-hal.git", rev = "20eaa910f0a05cd68684d6aa868fd78457c51be9" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[features]
desktop = ["iced/tiny-skia"]
default = ["desktop"]

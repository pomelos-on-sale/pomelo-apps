# The seven applications, as one project.
#
# Each app is its own crate — its own `main.rs`, its own test suite, its own `desktop` feature — and
# this table is what makes them one project: one `Cargo.lock`, `cargo test --workspace` in one
# command, and `cargo run -p <app>` from here.
#
# There is deliberately **no `[patch]` table**. A root's patches decide which iced and which renderer
# the whole graph gets, and in this repository that answer is "the real one, from crates.io, with a
# window" — that is what an app is when nobody is building it for the board. The firmware's roots
# have their own tables and depend on these crates by path: the same manifests, a different graph.
#
# The three crates the apps share (`pomelo-hal`, `pomelo-widgets`, `pomelo-material-symbols`) come
# from GitHub, pinned by revision in the manifests that need them, because this project builds on
# its own: only the applications are here.
[package]
name = "pomelo-apps"
version = "0.1.0"
edition = "2021"
description = "Pomelo OS Applications Workspace and Desktop Simulator"

[dependencies]
pomelo-runtime = { path = "../pomelo-runtime" }
pomelo-hal = { path = "../pomelo-hal" }
iced = { version = "0.14", default-features = false, features = ["thread-pool", "x11", "wayland", "tiny-skia"] }

[workspace]
resolver = "2"

members = [
    ".",
    "apps/app-launcher",
    "apps/calculator",
    "apps/counter",
    "apps/hello",
    "apps/music-player",
    "apps/settings",
    "apps/terminal",
]
default-members = ["."]

[patch.crates-io]
iced = { path = "../iced" }
iced_core = { path = "../iced/core" }
iced_debug = { path = "../iced/debug" }
iced_futures = { path = "../iced/futures" }
iced_graphics = { path = "../iced/graphics" }
iced_program = { path = "../iced/program" }
iced_renderer = { path = "../iced/renderer" }
iced_runtime = { path = "../iced/runtime" }
iced_tiny_skia = { path = "../iced/tiny_skia" }
iced_widget = { path = "../iced/widget" }
iced_winit = { path = "../iced/winit" }

[patch."https://github.com/pomelos-on-sale/pomelo-hal.git"]
pomelo-hal = { path = "../pomelo-hal" }


